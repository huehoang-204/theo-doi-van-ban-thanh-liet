# Dùng trên máy có Docker (staging/production). Máy dev A30 dùng scripts/dev/local-postgres.sh.
# Giai đoạn 6 sẽ bổ sung các service app, worker, caddy.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webtl}
      POSTGRES_USER: ${POSTGRES_USER:-webtl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${DEV_PG_PORT:-5452}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
